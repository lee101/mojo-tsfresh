[project]
name = "mojo-tsfresh"
version = "0.1.0"
description = "Compute-heavy tsfresh feature calculators implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "tsfresh", "time-series", "feature-extraction"]
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "tsfresh==0.21.2"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-tsfresh"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
